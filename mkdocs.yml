# Creator Atlas 阅读站配置（Material for MkDocs）。

# 构建流程：python site/prepare.py 生成 site/build → mkdocs build（输出 site/dist）。
# 导航由 site/hooks/gen_nav.py 在构建时按目录结构与索引页顺序自动生成，无需手工维护 nav。

site_name: Creator Atlas
site_description: 视频创作者方法论全景手册 · 中文优先的开源视频创作知识库
site_url: https://huanmoovo.github.io/creator-atlas/
copyright: Creator Atlas（HuanMoovo）· 文档 CC BY-SA 4.0 · 代码 MIT

docs_dir: site/build
site_dir: site/dist
use_directory_urls: true

repo_url: https://github.com/HuanMoovo/creator-atlas
repo_name: HuanMoovo/creator-atlas
edit_uri: ""

hooks:
  - site/hooks/gen_nav.py

theme:
  name: material
  language: zh
  logo: logo.svg
  favicon: logo.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 简体中文
        - locale: en
          name: English
          nav_translations:
            "首页": "Home"
            "前言": "Preface"
            "总目录": "Contents"
            "入门": "Start Here"
            "视频创作全景": "The Big Picture"
            "品类与赛道选择": "Niche & Track"
            "第一个视频": "Your First Video"
            "学习路径": "Learning Path"
            "角色与技能地图": "Roles & Skills"
            "方法域": "Method Domains"
            "定位与选题": "Positioning & Topics"
            "脚本与叙事": "Script & Storytelling"
            "拍摄与制作": "Production & Shooting"
            "剪辑与后期": "Editing & Post-Production"
            "包装与分发": "Packaging & Distribution"
            "增长与复盘": "Growth & Analytics"
            "变现与经营": "Monetization & Business"
            "制作方法": "Production Methods"
            "口播讲述": "Talking to Camera"
            "实拍纪实": "Real-Life & Documentary"
            "剧情表演": "Scripted & Performance"
            "操作演示": "Demo & Screencast"
            "对话访谈": "Conversation & Interview"
            "动画合成": "Animation & Synthesis"
            "素材再创": "Editorial & Remix"
            "商业摄制": "Commercial Production"
            "资源与工具": "Resources & Tools"
            "拍摄设备": "Gear"
            "软件与工具": "Software & Tools"
            "素材与版权": "Assets & Licensing"
            "AI 工具": "AI Tools"
            "数据与平台": "Data & Platforms"
            "清单与模板": "Checklists & Templates"
            "选题库模板": "Topic Bank"
            "口播脚本模板": "Talking-Head Script"
            "叙事脚本模板（两栏）": "Narrative Script (Two-Column)"
            "分镜表模板": "Storyboard"
            "标题与封面工作单": "Title & Thumbnail Worksheet"
            "发布前检查清单": "Pre-Publish Checklist"
            "复盘模板": "Retrospective"
            "关于": "About"
            "项目元信息": "Repository Info"
            "关于本库": "About This Repo"
            "内容路线图": "Content Roadmap"
            "术语表（中英对照）": "Glossary"
            "贡献指南": "Contributing"
            "行为准则": "Code of Conduct"
            "更新日志": "Changelog"

extra_css:
  - extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true

validation:
  links:
    absolute_links: info
    unrecognized_links: info
